services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: plant_ai
      POSTGRES_PASSWORD: plant_ai
      POSTGRES_DB: plant_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plant_ai -d plant_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
